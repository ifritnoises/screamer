[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "Ifrit", email = "contact@ifritnoises.org"}]
name = "screamer"
version = "0.1.1"
description = "Hybrid Network Tracer"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.7"
dependencies = ["scapy", "colorama", "ipaddress"]
keywords = ["pentesting", "security", "recon", "networking", "discovery", "sniffer", "maintenance", "infrastructure"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: Unix",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
  ]

[project.urls]
Repository = "https://github.com/ifritnoises/screamer"
Homepage = "https://github.com/ifritnoises/screamer"
Issues = "https://github.com/ifritnoises/screamer/issues"

[project.scripts]
screamer = "screamer:main"

[tool.setuptools]
py-modules = ["screamer"]
packages = ["modules"]